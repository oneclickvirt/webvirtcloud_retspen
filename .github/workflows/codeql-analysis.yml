name: CodeQL
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
        - javascript
        - python
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
'on':
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - master
  schedule:
  - cron: 0 21 * * 3
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
