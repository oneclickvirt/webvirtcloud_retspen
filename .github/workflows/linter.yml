name: Lint Code Base
jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Required packages
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-virtualenv libvirt-dev python3-lxml zlib1g-dev libxslt1-dev libsasl2-dev libldap2-dev pkg-config
    - name: Install dependencies
      run: |
        python3 -m venv "$RUNNER_TEMP/webvirtcloud-python"
        "$RUNNER_TEMP/webvirtcloud-python/bin/python" -m pip install --upgrade pip wheel
        if [[ -f dev/requirements.txt ]]; then requirements=dev/requirements.txt; else requirements=conf/requirements.txt; fi
        "$RUNNER_TEMP/webvirtcloud-python/bin/pip" install -r "$requirements"
    - name: Lint Code Base
      uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854
      env:
        FILTER_REGEX_EXCLUDE: .*(static|scss|venv|locale)/.*
        DEFAULT_BRANCH: master
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_PYTHON_MYPY: false
        VALIDATE_PYTHON_BLACK: false
        VALIDATE_PYTHON_FLAKE8: false
        VALIDATE_PYTHON_PYINK: false
        VALIDATE_PYTHON_PYLINT: false
        VALIDATE_PYTHON_ISORT: false
'on':
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - master
  workflow_dispatch: null
permissions:
  contents: read
  statuses: write
