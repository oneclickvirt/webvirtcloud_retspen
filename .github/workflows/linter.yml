name: Lint Code Base
jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install Required packages
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends python3-virtualenv libvirt-dev python3-lxml zlib1g-dev libxslt1-dev libsasl2-dev libldap2-dev pkg-config
    - name: Install dependencies
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/webvirtcloud-python"
        "$RUNNER_TEMP/webvirtcloud-python/bin/python" -m pip install --upgrade pip wheel
        "$RUNNER_TEMP/webvirtcloud-python/bin/pip" install -r conf/requirements.txt pip-audit
        "$RUNNER_TEMP/webvirtcloud-python/bin/python" -m pip check
    - name: Validate application dependency compatibility
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/webvirtcloud-python/bin/python" .github/tests/application_smoke.py
    - name: Audit runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/webvirtcloud-python/bin/python" -m pip_audit -r conf/requirements.txt --progress-spinner off --timeout 45
    - name: Lint Code Base
      uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854
      env:
        FILTER_REGEX_EXCLUDE: .*(static|scss|venv|locale)/.*
        DEFAULT_BRANCH: master
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: true
        VALIDATE_GITHUB_ACTIONS: true
        VALIDATE_PYTHON_FLAKE8: true
    timeout-minutes: 25
'on':
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - master
  workflow_dispatch: null
permissions:
  contents: read
  statuses: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_DEFAULT_TIMEOUT: '45'
  PIP_RETRIES: '3'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
